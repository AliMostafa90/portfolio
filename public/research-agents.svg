<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Multi-agent research system: a central orchestrator coordinating search, verification, and synthesis agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <radialGradient id="glowBrand" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="nodeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="nodeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.35"/>
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="640" fill="url(#bg)"/>
  <rect width="1200" height="640" fill="url(#grid)"/>
  <ellipse cx="600" cy="300" rx="520" ry="360" fill="url(#glowBrand)"/>
  <ellipse cx="905" cy="470" rx="330" ry="250" fill="url(#glowAccent)"/>

  <!-- mesh between agents -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.25">
    <path d="M340 220 L600 120 L860 220 L860 420 L600 520 L340 420 Z"/>
  </g>

  <!-- orchestrator edges -->
  <g fill="none" stroke="url(#edge)" stroke-width="2" stroke-linecap="round">
    <path d="M600 320 L340 220"/>
    <path d="M600 320 L600 120"/>
    <path d="M600 320 L860 220"/>
    <path d="M600 320 L860 420" stroke-dasharray="7 9"/>
    <path d="M600 320 L600 520" stroke-dasharray="7 9"/>
    <path d="M600 320 L340 420" stroke-dasharray="7 9"/>
  </g>

  <!-- source documents feeding the mesh -->
  <g opacity="0.5">
    <g transform="translate(96 128) rotate(-8)">
      <rect width="94" height="120" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/>
      <g fill="#34d399" fill-opacity="0.55">
        <rect x="16" y="24" width="62" height="6" rx="3"/>
        <rect x="16" y="42" width="48" height="6" rx="3"/>
        <rect x="16" y="60" width="56" height="6" rx="3"/>
        <rect x="16" y="78" width="34" height="6" rx="3"/>
      </g>
    </g>
    <g transform="translate(1010 392) rotate(7)">
      <rect width="94" height="120" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.16"/>
      <g fill="#5eead4" fill-opacity="0.55">
        <rect x="16" y="24" width="62" height="6" rx="3"/>
        <rect x="16" y="42" width="48" height="6" rx="3"/>
        <rect x="16" y="60" width="56" height="6" rx="3"/>
        <rect x="16" y="78" width="34" height="6" rx="3"/>
      </g>
    </g>
  </g>

  <!-- agent nodes -->
  <g>
    <!-- search -->
    <g transform="translate(340 220)">
      <circle r="42" fill="#10b981" opacity="0.28" filter="url(#soft)"/>
      <circle r="34" fill="url(#nodeA)"/>
      <g fill="none" stroke="#020617" stroke-width="3.2" stroke-linecap="round">
        <circle cx="-3" cy="-3" r="10"/>
        <path d="M5 5 L13 13"/>
      </g>
    </g>

    <!-- retrieve -->
    <g transform="translate(600 120)">
      <circle r="42" fill="#10b981" opacity="0.28" filter="url(#soft)"/>
      <circle r="34" fill="url(#nodeA)"/>
      <g fill="none" stroke="#020617" stroke-width="3.2" stroke-linecap="round">
        <ellipse cx="0" cy="-8" rx="13" ry="5"/>
        <path d="M-13 -8 V8 a13 5 0 0 0 26 0 V-8"/>
      </g>
    </g>

    <!-- verify -->
    <g transform="translate(860 220)">
      <circle r="42" fill="#14b8a6" opacity="0.28" filter="url(#soft)"/>
      <circle r="34" fill="url(#nodeB)"/>
      <path d="M-11 0 L-3 9 L12 -8" fill="none" stroke="#020617" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- synthesize -->
    <g transform="translate(860 420)">
      <circle r="42" fill="#14b8a6" opacity="0.28" filter="url(#soft)"/>
      <circle r="34" fill="url(#nodeB)"/>
      <g fill="none" stroke="#020617" stroke-width="3.2" stroke-linecap="round">
        <path d="M-12 -9 H12 M-12 0 H12 M-12 9 H3"/>
      </g>
    </g>

    <!-- cite -->
    <g transform="translate(600 520)">
      <circle r="42" fill="#14b8a6" opacity="0.28" filter="url(#soft)"/>
      <circle r="34" fill="url(#nodeB)"/>
      <g fill="none" stroke="#020617" stroke-width="3.2" stroke-linecap="round">
        <path d="M-10 -10 H4 L11 -3 V11 H-10 Z"/>
        <path d="M4 -10 V-3 H11"/>
      </g>
    </g>

    <!-- plan -->
    <g transform="translate(340 420)">
      <circle r="42" fill="#10b981" opacity="0.28" filter="url(#soft)"/>
      <circle r="34" fill="url(#nodeA)"/>
      <g fill="none" stroke="#020617" stroke-width="3.2" stroke-linecap="round">
        <circle cx="0" cy="-9" r="4"/>
        <circle cx="-9" cy="9" r="4"/>
        <circle cx="9" cy="9" r="4"/>
        <path d="M0 -5 L-9 5 M0 -5 L9 5"/>
      </g>
    </g>
  </g>

  <!-- orchestrator core -->
  <g transform="translate(600 320)">
    <circle r="96" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.25"/>
    <circle r="78" fill="none" stroke="#34d399" stroke-opacity="0.30" stroke-width="1.5" stroke-dasharray="4 10"/>
    <circle r="72" fill="#10b981" opacity="0.30" filter="url(#soft)"/>
    <circle r="58" fill="url(#hub)"/>
    <circle r="58" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.25"/>
    <g fill="none" stroke="#020617" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="9"/>
      <circle cx="0" cy="-26" r="6"/>
      <circle cx="23" cy="13" r="6"/>
      <circle cx="-23" cy="13" r="6"/>
      <path d="M0 -20 V-9 M6 4 L18 10 M-6 4 L-18 10"/>
    </g>
  </g>
</svg>
